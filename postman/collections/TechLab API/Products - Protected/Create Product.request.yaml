$kind: http-request
name: Create Product
method: POST
url: '{{baseUrl}}/api/products/create'
order: 1000
description: 'Creates a new product. Requires a valid JWT token. Required fields: name (string), description (string), price (number >= 0), category (string), stock (number >= 0). Optional: imageUrl (string).'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Laptop Pro 15",
      "description": "High-performance laptop with 16GB RAM and 512GB SSD",
      "price": 1299.99,
      "category": "Electronics",
      "stock": 10,
      "imageUrl": "https://example.com/laptop.jpg"
    }
