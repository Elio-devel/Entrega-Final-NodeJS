$kind: http-request
name: Update Product
method: PUT
url: '{{baseUrl}}/api/products/{{productId}}'
order: 2000
description: 'Updates an existing product by ID. Requires a valid JWT token. All fields are optional — only send the fields you want to update.'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "price": 999.99,
      "stock": 15
    }
