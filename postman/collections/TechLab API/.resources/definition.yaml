$kind: collection
name: TechLab API
description: |-
  Collection for the TechLab API — a Node.js/Express REST API.
  Includes authentication and product management endpoints (public and protected).
  Set the `baseUrl` variable to your server address and use the Login request to populate the `token` variable automatically.
variables:
  - key: baseUrl
    value: 'http://localhost:3000'
  - key: token
    value: ''
  - key: productId
    value: ''
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{token}}'
